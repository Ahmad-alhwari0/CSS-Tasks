<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>Product Card</title>
</head>
<body>
    <nav class="navbar">

        <ul>
            <li><a href="Product Card.html">Home</a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">About </a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="card">
        <div class="image-container">
          <img src="images/hedphone.jpg" alt="Aria Wireless Headphones">
          <span class="badge">-30%</span>
        </div>

        <div class="info">
          <h3>Aria Wireless Headphones</h3>
          <p>Active noise-cancelling, plush earcups, and 30 hours of battery life on a single charge.</p>
        

        <div class="price">
         <span class="new-price">$69.99</span>
         <span class="old-price">$99.99</span>
        </div>

        <div class="buttons">
         <button class="btn-cart">Add to Cart</button>
         <button class="btn-wishlist">Add to Wishlist</button>
        </div>
        </div> 
    </div>
    
    <div class="stock-wrapper">
        <span class="stock-notice">&#9888; Only 3 left in stock</span>
    </div>

</body>
</html>
